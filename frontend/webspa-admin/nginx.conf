server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Campaign/tenant media: MinIO proxied through this public vhost so
    # stored asset URLs and presigned browser uploads work from outside the
    # docker network. ^~ keeps the static-asset regex above from swallowing
    # /assets/ images; Host is pinned to the storage endpoint so presigned
    # PUT signatures (signed against minio:9000) stay valid. The resolver +
    # variable defer DNS so nginx still boots if minio is down. Scoped to the
    # campaign-assets bucket only: the Angular build's own /assets/* files
    # (sidebar logo, avatars) must keep being served from disk.
    location ^~ /assets/campaign-assets/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $asset_store "minio:9000";
        rewrite ^/assets/(.*)$ /$1 break;
        proxy_pass http://$asset_store;
        proxy_set_header Host $asset_store;
        client_max_body_size 8m;
        proxy_buffering off;
    }

    # Angular SPA routing - serve index.html for all routes
    # index.html must always revalidate: a cached stale copy references old
    # hashed bundles that 404 after a redeploy, leaving the app stuck on the
    # boot spinner. add_header in a location drops server-level headers, so
    # the security headers are repeated here.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
