id: TMP-042
title: Release decision packet refresh
class: operational_slice
actor: platform-operator
action: refresh blocked release-verification decisions against current evidence
outcome: prior local verification blockers are separated from production release decisions outside TMP-042 authority
entrypoints:
  - docs/agent/full-system-verification-2026-05-09.md
  - docs/agent/release-decision-packet-2026-05-09.md
  - .harness/context-packs/WO-TMP-042-001.json
invariants:
  - local verification evidence is not production release approval
  - decision packets do not mutate runtime code, schemas, dependencies, gitlinks, branch history, env files, or deploy state
acceptance:
  - decision packet exists and is refreshed
  - previous seven-blocker status is not presented as current
  - production/live-provider release decisions are explicitly outside this worker authority
  - no forbidden runtime or source files change
verification:
  - test -f docs/agent/release-decision-packet-2026-05-09.md
  - test -f slices/TMP-042-release-decision-packet/value-gate-report.md
  - git diff --check
  - agent-hub schema validate-all --root . --json
  - agent-hub reconcile --root . --check --json
